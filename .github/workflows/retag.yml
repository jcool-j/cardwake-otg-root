name: retag-v111-final-tree

on:
  push:
    paths:
      - '.github/workflows/retag.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove build infra and point v1.1.1 at the final tree
        run: |
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove retag workflow; tree matches the user-supplied archive exactly" || echo "nothing to commit"
          git push
          git tag -f v1.1.1 HEAD
          git push -f origin v1.1.1
