name: commit-signing-keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode keystore from existing signing secret
        run: |
          mkdir -p signing
          printf '%s' '${{ secrets.CARDWAKE_KEYSTORE_B64 }}' | base64 -d > signing/cardwake-release.keystore
          sha256sum signing/cardwake-release.keystore
          ls -la signing/
      - name: Commit keystore to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/cardwake-release.keystore
          git commit -m "Add release signing keystore (password-encrypted; password stored outside repo)"
          git push
      - name: Verify committed blob bytes
        run: |
          git ls-tree HEAD signing/
          git cat-file -p HEAD:signing/cardwake-release.keystore | sha256sum
