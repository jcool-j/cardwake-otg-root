name: replace-source-and-build

on:
  push:
    paths:
      - '.github/workflows/replace-and-build.yml'

permissions:
  contents: write

jobs:
  replace-and-build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download new source archive
        run: gh release download src-2026-11-21 --pattern 'cardwake-otg-root-source-v1.1.1.zip' --dir /tmp/src --clobber
      - name: Replace project files with the new source
        run: |
          mkdir -p /tmp/tree
          unzip -o -q /tmp/src/cardwake-otg-root-source-v1.1.1.zip -d /tmp/tree
          shopt -s dotglob
          for f in *; do
            case "$f" in
              .git|.github|signing) ;;
              *) rm -rf -- "$f" ;;
            esac
          done
          rsync -a /tmp/tree/cardwake-otg-root/ ./
          git status --porcelain | head -80
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace project source with user-supplied archive (2026-11-21)"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug and release APKs (unmodified source)
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
      - name: Zipalign and sign release APK
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"34* | sort -V | tail -1)
          mkdir -p /tmp/sign out
          printf '%s' '${{ secrets.CARDWAKE_KEYSTORE_B64 }}' | base64 -d > /tmp/sign/cardwake.keystore
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk out/cardwake-otg-root-v1.1.1-release.apk
          "$BT/apksigner" sign --ks /tmp/sign/cardwake.keystore --ks-key-alias cardwake \
            --ks-pass "pass:${{ secrets.CARDWAKE_KS_PASSWORD }}" --key-pass "pass:${{ secrets.CARDWAKE_KS_PASSWORD }}" \
            --min-sdk-version 26 out/cardwake-otg-root-v1.1.1-release.apk
      - name: Verify signature and package
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools/"34* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs out/cardwake-otg-root-v1.1.1-release.apk | head -12
          "$BT/aapt" dump badging out/cardwake-otg-root-v1.1.1-release.apk | head -4
          sha256sum out/cardwake-otg-root-v1.1.1-release.apk app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APKs to release v1.1.1
        run: gh release create v1.1.1 --title "v1.1.1" --notes "Built from the user-supplied 2026-11-21 source archive, unmodified. Signed release APK plus debug APK." out/cardwake-otg-root-v1.1.1-release.apk app/build/outputs/apk/debug/app-debug.apk
