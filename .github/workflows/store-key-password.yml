name: store-key-password-file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write keystore password file from existing secret (value never printed)
        run: |
          mkdir -p signing
          printf '%s' '${{ secrets.CARDWAKE_KS_PASSWORD }}' > signing/cardwake-key-password.txt
          wc -c signing/cardwake-key-password.txt
      - name: Commit password file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/cardwake-key-password.txt
          git commit -m "Add keystore password text file (user-requested plaintext backup in private repo)"
          git push
      - name: Verify committed file metadata only (no contents)
        run: git ls-tree -l HEAD signing/
