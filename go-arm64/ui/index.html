<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardwake</title>
<style>
:root{
  --bg:#05070c; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.08); --line:rgba(255,255,255,.09);
  --txt:#eef2ff; --mut:#8e98b8; --a1:#5eead4; --a2:#8b5cf6; --a3:#38bdf8;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --r:18px;
  --grad:linear-gradient(135deg,var(--a1),var(--a3) 45%,var(--a2));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* aurora background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:620px;height:620px;background:#0ea5a4;top:-220px;inset-inline-start:-120px}
.bg i:nth-child(2){width:560px;height:560px;background:#6d28d9;bottom:-240px;inset-inline-end:-100px;animation-duration:32s}
.bg i:nth-child(3){width:420px;height:420px;background:#0369a1;top:38%;inset-inline-start:42%;opacity:.22;animation-duration:38s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.12)}}
.bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 0%,transparent 40%,var(--bg) 100%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}

.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 28px 40px;min-height:100%;display:flex;flex-direction:column}

/* header */
header{display:flex;align-items:center;gap:14px;padding:6px 0 22px}
.logo{width:44px;height:44px;filter:drop-shadow(0 6px 22px rgba(94,234,212,.35))}
.brand b{display:block;font-size:22px;letter-spacing:.3px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{display:block;color:var(--mut);font-size:12.5px;margin-top:-2px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.pill.warn .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.pill.demo .dot{background:var(--a2);box-shadow:0 0 10px var(--a2)}
.iconbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:13.5px;transition:.2s}
.iconbtn:hover{background:var(--panel2);border-color:rgba(255,255,255,.18)}
.iconbtn svg{font-size:16px}

/* views */
.view{display:none;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--mut);margin-top:6px;max-width:640px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar{margin:26px 0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:9px;color:var(--mut);font-size:13.5px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:#cbd5e1;transition:.2s}
.toggle input:checked{background:var(--a1);border-color:transparent}
.toggle input:checked::after{inset-inline-start:16px;background:#06222a}
.link{color:var(--a3);font-size:13.5px;text-decoration:none;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.link:hover{text-decoration:underline}

/* glass card */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}

/* disk grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.disk{position:relative;text-align:start;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;transition:transform .25s,border-color .25s;animation:rise .5s both}
.disk::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(94,234,212,.16),transparent 60%);opacity:0;transition:.3s}
.disk:hover{transform:translateY(-3px);border-color:rgba(94,234,212,.4)}
.disk:hover::before{opacity:1}
.dtop{display:flex;gap:14px;align-items:center;position:relative}
.dicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--grad);color:#04141a;font-size:26px;box-shadow:0 8px 24px rgba(56,189,248,.28)}
.dname{font-weight:650;font-size:16.5px}
.dmeta{color:var(--mut);font-size:13px;margin-top:2px}
.chips{display:flex;gap:7px;flex-wrap:wrap;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent}
.chip svg{font-size:13px}
.chip.bad{background:rgba(251,113,133,.13);color:#fda4af;border-color:rgba(251,113,133,.3)}
.chip.warn{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.chip.ok{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.28)}
.chip.mut{background:var(--panel);color:var(--mut);border-color:var(--line)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}

.empty{padding:54px 28px;text-align:center}
.empty .big{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;color:var(--a1);background:rgba(94,234,212,.08);border:1px dashed rgba(94,234,212,.4);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(94,234,212,.06)}}
.empty h3{font-size:19px;margin-bottom:6px}
.empty ul{list-style:none;color:var(--mut);display:inline-block;text-align:start;margin-top:10px;font-size:13.5px}
.empty li::before{content:"•";color:var(--a1);margin-inline-end:9px}

/* disk detail */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;padding:6px 2px;margin-bottom:12px;transition:.2s}
.back:hover{color:var(--txt)}
[dir=rtl] .back svg{transform:scaleX(-1)}
.dhead{display:flex;gap:18px;align-items:center;padding:22px;margin-bottom:16px}
.dhead .dicon{width:66px;height:66px;font-size:32px;border-radius:19px}
.dhead h1{font-size:25px}
.diag{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:14px;margin-bottom:22px;border:1px solid var(--line);background:var(--panel)}
.diag .di{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.diag.bad{background:rgba(251,113,133,.07);border-color:rgba(251,113,133,.3)}.diag.bad .di{background:rgba(251,113,133,.18);color:#fda4af}
.diag.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.28)}.diag.warn .di{background:rgba(251,191,36,.16);color:#fcd34d}
.diag.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.26)}.diag.ok .di{background:rgba(52,211,153,.16);color:#6ee7b7}
.diag b{display:block;margin-bottom:2px}.diag span{color:var(--mut);font-size:13.5px}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.act{position:relative;text-align:start;padding:18px;display:flex;gap:14px;align-items:flex-start;transition:.25s;overflow:hidden}
.act:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(139,92,246,.55);box-shadow:0 14px 40px rgba(109,40,217,.22)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.07);color:var(--a1);flex:none;transition:.25s}
.act:hover:not(:disabled) .ai{background:var(--grad);color:#04141a}
.act b{display:block;font-size:16px;margin-bottom:3px}
.act span{color:var(--mut);font-size:13.2px;display:block}
.act.danger .ai{color:var(--bad)}
.act.rec{border-color:rgba(94,234,212,.55);box-shadow:0 0 0 1px rgba(94,234,212,.25),0 12px 40px rgba(94,234,212,.12)}
.act .badge,.badge{position:absolute;top:12px;inset-inline-end:12px;display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--grad);color:#04141a;letter-spacing:.3px}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,5,10,.66);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);padding:26px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet p.d{color:var(--mut);font-size:13.5px;margin-bottom:18px}
.lbl{display:block;font-size:12.5px;color:var(--mut);margin:16px 0 8px;font-weight:600;letter-spacing:.2px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:13.5px;transition:.2s;user-select:none}
.tchip svg{font-size:16px}
.tchip.on{color:#04141a;background:var(--grad);border-color:transparent;font-weight:650}
.field{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;transition:.2s;direction:ltr;text-align:start}
input[type=text]:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(94,234,212,.14)}
.seg{display:inline-flex;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 16px;border-radius:9px;color:var(--mut);font-size:13.5px;transition:.2s}
.seg button.on{background:var(--panel2);color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-weight:650;transition:.2s;font-size:14.5px}
.btn.pri{background:var(--grad);color:#04141a;box-shadow:0 8px 26px rgba(56,189,248,.3)}
.btn.pri:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:var(--panel);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 8px 26px rgba(225,29,72,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.warnbox{display:flex;gap:12px;padding:13px 15px;border-radius:13px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.3);color:#fecdd3;font-size:13.5px;margin-top:6px}
.warnbox svg{font-size:20px;flex:none;color:var(--bad);margin-top:2px}

/* job */
.jhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.jhead h1{font-size:25px}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
.status.running{color:var(--a1)}.status.done{color:var(--ok)}.status.error{color:var(--bad)}.status.cancelled{color:var(--warn)}
.status .sd{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.running .sd{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.jmain{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.jmain{grid-template-columns:1fr}}
.ringbox{padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:210px;height:210px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .5s ease;filter:drop-shadow(0 0 9px rgba(94,234,212,.55))}
.ring.running .val{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 16px rgba(139,92,246,.8))}}
.ring.done .val{stroke:var(--ok);filter:drop-shadow(0 0 12px rgba(52,211,153,.6))}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1}
.ring .pct small{font-size:20px;color:var(--mut);font-weight:600}
.ring .cap{color:var(--mut);font-size:12.5px;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{padding:11px 13px;border-radius:13px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.stat small{display:block;color:var(--mut);font-size:11.5px;font-weight:600;letter-spacing:.3px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.panel{padding:20px}
.panel h3{font-size:14px;color:var(--mut);font-weight:650;margin-bottom:12px;letter-spacing:.3px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;min-height:30px}
.cnt{padding:5px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;display:inline-flex;gap:8px;align-items:center}
.cnt b{color:var(--a1);font-variant-numeric:tabular-nums}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;max-height:330px;overflow:auto;padding:2px}
.gal::-webkit-scrollbar,.log::-webkit-scrollbar{width:8px}.gal::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.th{aspect-ratio:1;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;position:relative;cursor:pointer;animation:pop .4s both;transition:.2s}
.th:hover{border-color:var(--a1);transform:scale(1.04)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.part::after{content:"!";position:absolute;top:5px;inset-inline-end:5px;width:17px;height:17px;border-radius:50%;background:var(--warn);color:#2b1d00;font-size:11px;display:grid;place-items:center}
.galempty{color:var(--mut);font-size:13.5px;padding:26px 0;text-align:center}

.steps{list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:13px;padding:10px 8px;border-radius:11px;color:var(--mut);transition:.3s}
.steps li .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;flex:none}
.steps li.cur{color:var(--txt);background:rgba(255,255,255,.04)}
.steps li.cur .sn{border-color:var(--a1);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.done{color:var(--txt)}
.steps li.done .sn{background:var(--ok);border-color:var(--ok);color:#04231a}
@keyframes spin{to{transform:rotate(360deg)}}
.log{max-height:230px;overflow:auto;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.3px;line-height:1.65;direction:ltr;text-align:start;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.log div{white-space:pre-wrap;word-break:break-word}
.log .ok{color:#6ee7b7}.log .warn{color:#fcd34d}.log .fail{color:#fda4af}.log .info{color:#a5b0cf}
details.lg{margin-top:16px}
details.lg summary{cursor:pointer;color:var(--mut);font-size:13px;margin-bottom:10px;list-style:none;display:inline-flex;gap:8px;align-items:center}
details.lg summary::-webkit-details-marker{display:none}

.verdict{display:flex;gap:16px;padding:20px;border-radius:16px;margin-top:16px;border:1px solid var(--line);animation:rise .5s}
.verdict .vi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:26px;flex:none}
.verdict.ok{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.35)}.verdict.ok .vi{background:rgba(52,211,153,.2);color:#6ee7b7}
.verdict.bad{background:rgba(251,113,133,.07);border-color:rgba(251,113,133,.35)}.verdict.bad .vi{background:rgba(251,113,133,.2);color:#fda4af}
.verdict.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.32)}.verdict.warn .vi{background:rgba(251,191,36,.18);color:#fcd34d}
.verdict h3{font-size:18px;margin-bottom:4px}
.panel .verdict h3,.glass .verdict h3{color:var(--txt);letter-spacing:0}
.verdict p{color:#c4cbe3;font-size:14px}
.verdict ul{margin:10px 0 0;padding-inline-start:20px;color:#c4cbe3;font-size:13.8px;display:flex;flex-direction:column;gap:6px}
.verdict .btns{justify-content:flex-start;margin-top:16px}

.toast{position:fixed;bottom:26px;inset-inline:0;margin:auto;width:max-content;max-width:min(560px,92vw);z-index:40;padding:13px 20px;border-radius:14px;background:#1b1020;border:1px solid rgba(251,113,133,.5);color:#fecdd3;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;font-size:14px}
.toast.on{display:block;animation:rise .3s}

.sect{margin:26px 2px 12px;display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acts .act{padding:15px;gap:12px}
.acts .act .ai{width:40px;height:40px;font-size:20px;border-radius:12px}
.acts .act b{font-size:14.5px}.acts .act span{font-size:12.6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13.5px}
.kv dt{color:var(--mut)}.kv dd{font-variant-numeric:tabular-nums;word-break:break-all;direction:ltr;text-align:start}
.map{display:block;width:100%;height:auto;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--mut);font-size:12.5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:16px}
.brow small{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:6px}
.brow small b{color:var(--txt);font-size:16px;font-variant-numeric:tabular-nums}
.brow .bar{height:10px}
.badges{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.badge2{padding:6px 14px;border-radius:11px;font-weight:700;font-size:13.5px;background:var(--grad);color:#04141a}
.badge2.no{background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.sw{display:block;margin:14px auto 4px;width:min(300px,100%)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--mut);font-weight:600;font-size:12px;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.tbl .mini{padding:5px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin-inline-end:5px}
.tbl .mini:hover{border-color:var(--a1)}.tbl .mini.red:hover{border-color:var(--bad);color:#fda4af}
.sheet.wide{width:min(780px,100%);max-height:92vh;overflow:auto}

async function api(path, body) {
  const opt = body === undefined ? {headers:{'X-Token':TOKEN}} : {method:'POST', headers:{'X-Token':TOKEN,'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const err = new Error(j.error || r.statusText); err.code = r.status; throw err; }
  return j;
}
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 5600); }
const ltr = x => '\u2066' + x + '\u2069';
const fmtBraw = n => { n = +n || 0; if (!n) return '0 B'; const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1000 && i < 4) { n /= 1000; i++; } return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i]; };
const fmtB = n => ltr(fmtBraw(n));
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };

}

/* ---------------- disks ---------------- */
function diskState(d) {
  const ro = d.readonly || (d.volumes || []).some(v => v.ro);
  const nomedia = !d.size || /no media/i.test(d.opstatus || '');
  const raw = !nomedia && (d.style === 'RAW' || !(d.volumes || []).length);
  return { ro, raw, nomedia, offline: d.offline, bad: d.health && d.health !== 'Healthy' && d.health !== '' };
}
function diskSub(d) {
  const v = (d.volumes || []).map(x => (x.fs || '?') + ' · ' + x.letter + ':').join('  ');
  return `<bdi dir="ltr">${d.size ? fmtB(d.size) : '0 B'} · ${esc(d.bus)}${v ? ' · ' + esc(v) : ''}</bdi>`;
}
function chipsFor(d) {
  const s = diskState(d), c = [];
  if (s.nomedia) c.push(`<span class="chip bad">${ico('warn')}${t('nomedia')}</span>`);
  if (s.ro) c.push(`<span class="chip bad">${ico('lock')}${t('ro')}</span>`);
  if (s.raw) c.push(`<span class="chip warn">${ico('warn')}${t('nofs')}</span>`);
  if (s.offline) c.push(`<span class="chip warn">${t('offline')}</span>`);
  if (s.bad) c.push(`<span class="chip bad">${t('unhealthy')}</span>`);
  if (!c.length) c.push(`<span class="chip ok">${ico('check')}${t('healthy')}</span>`);
  return c.join('');
}

function actCard(k, ic, rec, dis, hint, titleKey, descKey) {

function renderDisk() {
  const d = S.sel; if (!d) return;
  const s = diskState(d), isImg = !!d.image;
  let diag = '';
  if (!isImg) {
    const k = s.nomedia ? 'dead' : (s.ro && s.raw ? 'both' : s.ro ? 'ro' : s.raw ? 'raw' : 'ok');
    const cls = k === 'ok' ? 'ok' : (k === 'raw' ? 'warn' : 'bad');
    diag = `<div class="diag ${cls}"><div class="di">${ico(k === 'ok' ? 'check' : 'warn')}</div><div><b>${t('diag_' + k + '_t')}</b><span>${t('diag_' + k + '_d')}</span></div></div>`;
  }
  const rec = isImg ? 'recover' : (s.nomedia ? 'diagnose' : (s.raw ? 'recover' : (s.ro ? 'unlock' : 'recover')));
  let html = `<div class="glass dhead"><div class="dicon">${ico(isImg ? 'folder' : (d.bus === 'USB' ? 'usb' : 'sd'))}</div>
      <div><h1>${esc(d.name)}</h1><div class="dmeta">${isImg ? esc(d.image) : diskSub(d)}</div>
      ${isImg ? '' : `<div class="chips" style="margin-top:10px">${chipsFor(d)}</div>`}</div></div>${diag}`;
  const sec = (title, items) => `<div class="sect">${t(title)}</div><div class="acts">${items.join('')}</div>`;
  if (isImg) {
    html += `<div class="acts">${actCard('recover', 'recover', true, false)}</div>`;
  } else {
    const nm = s.nomedia, nofs = nm || s.raw;
    const C = (k, ic, dis, hint, tk, dk) => actCard(k, ic, k === rec, dis, hint, tk, dk);
    html += sec('s_rescue', [C('recover','recover',nm,t('need_media')), C('image','save',nm,t('need_media')), C('restore','restore',nm,t('need_media'))]);
    html += sec('s_repair', [C('unlock','unlock',nm,t('need_media')), C('repair','tool',nofs,nm ? t('need_media') : t('need_fs')), C('parts','parts',nm,t('need_media')), C('format','trash',nm,t('need_media'))]);
    html += sec('s_health', [C('diagnose','pulse',false), C('surface','grid',nm,t('need_media')), C('fake','spy',nm,t('need_media')), C('bench','speed',nm,t('need_media'))]);
    html += sec('s_tools', [C('info','info',false), s.ro ? C('wblock','lock',nm,'', 'a_wblock_off', 'a_wblock_off_d') : C('wblock','shield',nm,t('need_media'), 'a_wblock_on', 'a_wblock_on_d'),
      C('eject','eject',false), C('bitlocker','key',nofs,nm ? t('need_media') : t('need_fs')), C('shred','shred',false), C('vault','vault',false)]);
  }
  $('#diskBody').innerHTML = html;
  $('#diskBody').querySelectorAll('.act').forEach(b => b.onclick = () => openSheet(b.dataset.a));
}

function drawMap(j) {

      if (st === 'ok') return vb('ok', 'check', t('dg_ok'), `<p>${t('dg_ok_d')}</p>${facts}`, back);
      if (st === 'degraded') return vb('warn', 'warn', t('dg_degraded'), `<p>${t('dg_degraded_d')}</p>${facts}`, B('image', t('cta_image'), 1, 'save') + B('surface', t('cta_surface'), 0, 'grid') + back);
      if (st === 'swlock') return vb('bad', 'lock', t('dg_swlock'), `<p>${t('dg_swlock_d')}</p>${facts}`, B('unlock', t('cta_unlock'), 1, 'unlock') + B('recover', t('cta_recover'), 0, 'recover') + back);
      if (st === 'hwlock') return vb('bad', 'lock', t('dg_hwlock'), `<p>${t('dg_hwlock_d')}</p>${SWSVG()}<ul><li>${t('v_b1')}</li><li>${t('v_b2')}</li><li>${t('v_b3')}</li></ul>${facts}`, B('recover', t('cta_recover'), 1, 'recover') + back);
      return vb('bad', 'warn', t('dg_dead'), `<p>${t('dg_dead_d')}</p><ul><li>${t('dg_dead_1')}</li><li>${t('dg_dead_2')}</li><li>${t('dg_dead_3')}</li></ul>${facts}`, back); }
    case 'surface': {
      const cls = st === 'ok' ? 'ok' : st === 'slow' ? 'warn' : 'bad';
      const d = st === 'ok' ? t('sf_ok_d', {v: Math.round(r.avgMBs || 0)}) : st === 'slow' ? t('sf_slow_d') : t('sf_bad_d');
      return vb(cls, st === 'ok' ? 'check' : 'warn', t('sf_' + st), `<p>${d}</p>`, (st === 'ok' ? '' : B('image', t('cta_image'), 1, 'save') + B('recover', t('cta_recover'), 0, 'recover')) + back); }
    case 'fakecap': if (st === 'writeerror') return vb('warn', 'lock', t('fk_werr'), `<p>${t('fk_werr_d')}</p>`, B('unlock', t('a_unlock'), 1, 'unlock') + back);
      return st === 'ok' ? vb('ok', 'check', t('fk_ok'), `<p>${t('fk_ok_d')}</p>`, B('format', t('fk_fmt'), 1, 'trash') + back)
      : vb('bad', 'warn', t('fk_fake'), `<p>${t('fk_fake_d', {c: fmtB(r.claimed), r: fmtB(r.real)})}</p>`, B('format', t('fk_fmt'), 1, 'trash') + back);
    case 'bench': return vb('ok', 'check', t('bn_done'), `<div class="badges" id="bb"></div>${r.noWrite ? `<p style="margin-top:10px">${t('bn_nowrite')}</p>` : ''}`, back);
    case 'wblock': return r.on ? vb(st === 'ok' ? 'ok' : 'bad', st === 'ok' ? 'shield' : 'warn', t(st === 'ok' ? 'wb_on' : 'f_failed'), `<p>${t('wb_on_d')}</p>`, back) : vb(st === 'ok' ? 'ok' : 'bad', st === 'ok' ? 'check' : 'warn', t(st === 'ok' ? 'wb_off' : 'f_failed'), `<p>${t('wb_off_d')}</p>`, back);
    case 'eject': return st === 'ok' ? vb('ok', 'check', t('ej_ok'), '', B('home', t('back_home'), 1)) : vb('warn', 'warn', t('ej_busy'), `<p>${t('ej_busy_d')}</p>`, B('retry', t('ej_retry'), 0) + B('kill', t('ej_kill'), 1) + back);
    case 'bitlocker': return st === 'ok' ? vb('ok', 'check', t('bl_ok'), '', back) : st === 'unavailable' ? vb('warn', 'warn', t('bl_un'), `<p>${t('bl_un_d')}</p>`, B('vault', t('a_vault'), 1, 'vault') + back) : vb('bad', 'warn', t('f_failed'), '', back);
    case 'shred': return vb('ok', 'check', t('sh_done', {n: r.files || 0}), `<p>${t('sh_flash')}</p>`, B('home', t('back_home'), 1));
    case 'vault':
      if (j.status === 'error') return vb('bad', 'warn', t(st === 'wrongpw' ? 'vt_wrong' : 'st_error'), `<p>${esc(j.error)}</p>`, B('home', t('back_home')));
      return r.file ? vb('ok', 'check', t('vt_done_enc'), `<p style="direction:ltr"><code>${esc(r.file)}</code></p>`, B('home', t('back_home'), 1))
                    : vb('ok', 'check', t('vt_done_dec', {n: r.files || 0}), '', B('open', t('open_folder'), 1, 'folder') + B('home', t('back_home')));
  }
  return '';
}
function benchBadges(j) {
  const r = j.result || {}, bb = $('#bb'); if (!bb) return;
  const chip = (txt, on) => `<span class="badge2 ${on ? '' : 'no'}">${txt}</span>`;
  bb.innerHTML = chip(r.class || '–', !!r.class) + chip(r.v || '–', !!r.v) + chip(r.a || 'A–', !!r.a) +
    (r.seqWrite ? `<span class="badge2 ${r.seqWrite >= 30 ? '' : 'no'}">${r.seqWrite >= 30 ? t('bn_4k_ok') : t('bn_4k_no')}</span>` : '');
}
function bindRow(j) {
  document.querySelectorAll('#jsum [data-x]').forEach(b => b.onclick = async () => {
    const x = b.dataset.x;
    if (x === 'open') return api('/api/open', {});
    if (x === 'retry' || x === 'kill') { return startJob('/api/eject', {disk: S.sel.number, kill: x === 'kill'}); }
    await api('/api/dismiss', {}).catch(() => {}); S.jobId = ''; S.job = null;
    if (x === 'home' || (x === 'disk' && !S.sel) || x === 'vault') { await loadDisks(); setView('home'); if (x === 'vault') sheetVault(); return; }
    await loadDisks();
    if (S.sel && !S.sel.image) { const f = S.disks.find(d => d.number === S.sel.number); if (f) S.sel = f; }
    renderDisk(); setView('disk');
    if (x !== 'disk') openSheet(x);
  });
}
function addThumbs() {
  const gal = $('#gal'); if (!gal) return;
  const MAX = 150;
  if (S.renderedFiles === 0 && S.files.length) gal.innerHTML = '';
  while (S.renderedFiles < S.files.length) {
    const f = S.files[S.renderedFiles++];
    if (gal.querySelectorAll('.th:not(.more)').length >= MAX) continue;
    const d = document.createElement('div'); d.className = 'th' + (f.ok ? '' : ' part'); d.title = f.rel;
    if (['jpg','png','gif','bmp','webp'].includes(f.ext)) { const im = new Image(); im.loading = 'lazy'; im.src = '/api/thumb?t=' + encodeURIComponent(TOKEN) + '&f=' + encodeURIComponent(f.rel); d.appendChild(im); }
    else d.textContent = f.ext;
    d.onclick = () => api('/api/open', {rel: f.rel}).catch(() => {});
    gal.insertBefore(d, gal.querySelector('.more'));
  }
  const shown = gal.querySelectorAll('.th:not(.more)').length, extra = S.files.length - shown;
  let m = gal.querySelector('.more'); if (extra > 0) { if (!m) { m = document.createElement('div'); m.className = 'th more'; gal.appendChild(m); } m.textContent = '+' + extra; } else if (m) m.remove();
}
let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const r = await api(`/api/state?job=${S.jobId}&since=${S.filesSeen}&logsince=${S.logSeen}`);
    const j = r.job;
    if (j) {
      if (j.id !== S.jobId) { S.jobId = j.id; S.filesSeen = 0; S.logSeen = 0; S.files = []; S.renderedFiles = 0; buildJob(j); if (S.view !== 'job') setView('job'); }
      S.files.push(...j.files); S.filesSeen += j.files.length; S.logSeen += j.log.length;
      S.job = j; updateJob(j);
    }
  } catch(e) { /* retry */ }
  pollTimer = setTimeout(poll, S.job && S.job.status === 'running' ? 450 : 1200);
}

/* ---------------- boot ---------------- */
$('#langBtn').onclick = () => { S.lang = S.lang === 'he' ? 'en' : 'he'; try { localStorage.setItem('cw_lang', S.lang); } catch(e) {} applyLang(); renderHome(); if (S.view === 'disk') renderDisk();
  if (S.job) { const j = S.job; S.jobId = ''; S.filesSeen = 0; S.logSeen = 0; S.files = []; S.renderedFiles = 0; } };
$('#refreshBtn').onclick = loadDisks;
$('#showAll').onchange = e => { S.showAll = e.target.checked; renderHome(); };
$('#backHome').onclick = () => { setView('home'); loadDisks(); };
$('#openImg').onclick = async () => {
  const r = await pick('image');
  if (r.path) { S.sel = {image: r.path, name: baseOf(r.path), size: 0, bus: 'IMG', volumes: [], style: 'IMG'}; renderDisk(); setView('disk'); }
};
window.addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/bye?t=' + encodeURIComponent(TOKEN)); } catch(e) {} });
setInterval(() => api('/api/ping', {}).catch(() => {}), 3000);
(async function init() {
  try { S.info = await api('/api/info'); } catch(e) {}
  $('#ver').textContent = 'v' + (S.info.version || '');
  applyLang(); setView('home'); await loadDisks(); poll();
})();
</script>
</body>
